<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UrbanSense AI | Control Panel</title>
    
    <!-- Leaflet for Interactive Maps -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <!-- App Container -->
    <div class="app-layout">
        
        <!-- Sidebar Navigation -->
        <aside class="sidebar hidden" id="app-sidebar">
            <div class="sidebar-header">UrbanSense AI</div>
            <ul class="nav-menu">
                <li class="nav-item active" data-target="dashboard-view">Dashboard</li>
                <li class="nav-item" data-target="map-view">Live Map</li>
                <li class="nav-item" data-target="report-view">Submit Issue</li>
                <li class="nav-item" data-target="notifications-view">Notifications <span id="notif-badge" class="badge">0</span></li>
                <li class="nav-item" id="nav-logout">Logout</li>
            </ul>
        </aside>

        <!-- Main Content Area -->
        <main class="main-content">
            
            <!-- Auth View -->
            <section id="auth-view" class="panel active">
                <div class="auth-box">
                    <h2>System Login</h2>
                    <form id="login-form">
                        <input type="email" id="login-email" placeholder="Email" required>
                        <input type="password" id="login-password" placeholder="Password" required>
                        <button type="submit" class="btn-action">Authenticate</button>
                    </form>
                    <div id="auth-error" class="error-log"></div>
                </div>
            </section>

            <!-- Dashboard View (Analytics & Feedback) -->
            <section id="dashboard-view" class="panel">
                <header class="panel-header"><h2>System Overview</h2></header>
                
                <div class="stats-grid">
                    <div class="stat-box">Total<div class="stat-val" id="stat-total">0</div></div>
                    <div class="stat-box">Pending<div class="stat-val" id="stat-pending">0</div></div>
                    <div class="stat-box">Resolved<div class="stat-val" id="stat-resolved">0</div></div>
                    <div class="stat-box critical">Emergency<div class="stat-val" id="stat-emergency">0</div></div>
                </div>

                <div class="split-view">
                    <div class="list-container">
                        <h3>Critical Complaints</h3>
                        <div id="critical-list" class="data-list"></div>
                    </div>
                    <div class="list-container">
                        <h3>Recent Feedback</h3>
                        <div id="feedback-list" class="data-list"></div>
                    </div>
                </div>
            </section>

            <!-- Interactive Map View -->
            <section id="map-view" class="panel">
                <header class="panel-header"><h2>Geospatial Analysis</h2></header>
                <div id="urban-map" class="map-container"></div>
            </section>

            <!-- Submit Issue (With File Upload) -->
            <section id="report-view" class="panel">
                <header class="panel-header"><h2>Submit Report</h2></header>
                <form id="complaint-form" class="data-form">
                    <input type="text" id="comp-title" placeholder="Issue Title" required>
                    <textarea id="comp-desc" placeholder="Detailed Description" rows="4" required></textarea>
                    
                    <div class="form-row">
                        <input type="number" step="any" id="comp-lat" placeholder="Latitude" required>
                        <input type="number" step="any" id="comp-lng" placeholder="Longitude" required>
                    </div>

                    <!-- Connects to /upload/image backend -->
                    <div class="file-upload-zone">
                        <label>Attach Evidence (Image)</label>
                        <input type="file" id="comp-image" accept=".jpg,.jpeg,.png">
                    </div>

                    <button type="submit" class="btn-action">Deploy Report</button>
                    <div id="upload-status" class="status-log"></div>
                </form>
            </section>

            <!-- Notifications View -->
            <section id="notifications-view" class="panel">
                <header class="panel-header"><h2>System Notifications</h2></header>
                <div id="notifications-list" class="data-list full-height"></div>
            </section>

        </main>
    </div>

    <script src="app.js"></script>
</body>
</html>
